<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon: A stylized "10" with gaming elements -->
  <g transform="translate(10, 10)">
    <circle cx="40" cy="40" r="38" fill="none" stroke="url(#grad1)" stroke-width="4" />
    <path d="M30 20 L30 60 M45 20 A15 20 0 1 1 45 60 A15 20 0 1 1 45 20" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
    <path d="M20 40 L60 40 M40 20 L40 60" stroke="#7c3aed" stroke-width="2" opacity="0.3" />
  </g>
  
  <!-- Text -->
  <text x="100" y="45" font-family="Arial, sans-serif" font-weight="900" font-size="32" fill="white" style="letter-spacing: 2px;">
    TOP <tspan fill="url(#grad1)">10</tspan>
  </text>
  <text x="100" y="75" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#22d3ee" style="letter-spacing: 4px; text-transform: uppercase;">
    Sítios de Jogos
  </text>
  <text x="100" y="92" font-family="Arial, sans-serif" font-weight="400" font-size="8" fill="white" opacity="0.4" style="letter-spacing: 1px;">
    top10sitiosdejogos.com
  </text>
</svg>
